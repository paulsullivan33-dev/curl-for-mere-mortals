site_name: curl for Mere Mortals
site_description: Plain-language curl. Reading replies whole, sending data in its three encodings, credentials without the leaks, downloads that survive interruption, and scripts with deadlines and honest exit codes, all against a local lab server that reports what it received.
site_url: https://paulsullivan33-dev.github.io/curl-for-mere-mortals/

